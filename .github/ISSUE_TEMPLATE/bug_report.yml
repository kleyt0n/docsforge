name: Bug report
description: Report a problem with docsforge
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please search existing issues
        first. For security vulnerabilities, do **not** use this form — report
        them privately via
        [Security advisories](https://github.com/my-org/docsforge/security/advisories/new).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproducible example
      description: The smallest snippet that reproduces the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback / output
      description: Full error output, if any.
      render: shell
  - type: input
    id: version
    attributes:
      label: docsforge version
      description: Output of `python -c "import docsforge; print(docsforge.__version__)"`
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and key dependency versions (`uv pip freeze`).
    validations:
      required: true
