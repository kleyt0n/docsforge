# ==================================================================== #
# Docsforge — Material for MkDocs                                      #
#                                                                      #
# Placeholders replaced by `python scripts/init_template.py`:          #
#   docsforge · Docsforge · my-org · Docsforge contributors            #
# ==================================================================== #

site_name: Docsforge
site_description: >-
  A short, punchy description of docsforge — what it does, for whom, and
  what makes it different. Two lines at most; it lands in search results.
site_author: Docsforge contributors
site_url: https://my-org.github.io/docsforge/
repo_name: my-org/docsforge
repo_url: https://github.com/my-org/docsforge
edit_uri: edit/main/docs/
copyright: Copyright &copy; Docsforge contributors — MIT License

docs_dir: docs

theme:
  name: material
  logo: logo.svg
  favicon: logo.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Google Sans Flex
    code: Google Sans Code
  # `custom` suppresses Material's built-in color rules, so the neutral
  # ramp in docs/stylesheets/extra.css owns every color on the site.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/my-org/docsforge
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/docsforge/
  # Drop the "Made with Material for MkDocs" line. Set to `true` to keep it.
  generator: false

# Builds the rustdoc API reference and folds it into the site during every
# build, so `mkdocs serve` serves it too. Requires the Rust toolchain; remove
# alongside `rust/` for a non-Rust project.
hooks:
  - scripts/rustdoc_hook.py

# Turn silent link rot into build failures under `mkdocs build --strict`.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  # `base_path` lets docs pages pull in repo-root files (example scripts,
  # etc.) with the `--8<--` include syntax, so they never drift out of sync.
  - pymdownx.snippets:
      base_path: [., docs]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  # Renders an og:image per page, so links shared in Slack, Discord, or a
  # tweet show the page title over the site's own palette instead of a blank
  # card. Card generation needs Cairo and friends, which is a real install on
  # macOS and Windows — so it is off locally and on in CI, where the images
  # that actually ship are built. `mkdocs serve` stays a one-command affair.
  - social:
      cards: !ENV [CI, false]
      cards_layout_options:
        background_color: "#212529" # --site-c-carbon-black
        color: "#f8f9fa" # --site-c-bright-snow
  # Renders the API reference straight from source docstrings, so it can
  # never disagree with the code. Remove this block for a non-code project.
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            filters: ["!^_"]
            docstring_section_style: table

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Core concepts: getting-started/concepts.md
  - User guide:
      - Basic usage: guide/basic-usage.md
      - Advanced usage: guide/advanced.md
      - Writing docs: guide/writing-docs.md
  - API reference:
      - Overview: reference/index.md
      - Core: reference/core.md
      - Utilities: reference/utils.md
      - Rust API: reference/rust.md
      - API stability: reference/stability.md
