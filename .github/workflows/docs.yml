name: Docs

# Builds the site and publishes it to GitHub Pages.
#
# One-time setup in the repository: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". No token or gh-pages branch needed.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**" # the API reference is generated from docstrings
      - "rust/**" # the Rust API reference is generated by rustdoc
      - "examples/**" # included verbatim into the guide pages
      - ".github/workflows/docs.yml"
  workflow_dispatch: # allow manual runs

# The build job needs nothing but a checkout; the deploy job widens this for
# itself below.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      # Cairo and friends, needed by the social-cards plugin to render the
      # og:image for each page.
      - name: Install imaging libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev
      - name: Install docs deps
        run: uv sync --extra docs
      # The rustdoc hook in mkdocs.yml builds the crate docs during the site
      # build and folds them into site/rust/, so cargo must be present.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build site
        run: uv run mkdocs build --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # OIDC token used by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
