# Keeps the three dependency surfaces of this template current.
#
# Updates are grouped so a quiet week produces one pull request per ecosystem
# rather than six. Majors stay ungrouped: they deserve to be read one at a time.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

  # Delete this block alongside `rust/` if your project has no crate.
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
