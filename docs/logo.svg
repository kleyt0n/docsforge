<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Docsforge logo">
  <title>Docsforge</title>
  <!-- Docsforge mark: an anvil whose top slab is a dog-eared page — forge on
       the left (horn), docs on the right (folded corner). One solid
       silhouette in Bright Snow (#f8f9fa) so it reads on the Carbon Black
       header in both schemes; no strokes, so nothing thins out at the 72px
       the hero renders it at. Swap this file for your own logo (keep it a
       single-color SVG). -->
  <path fill="#f8f9fa" d="M352 256 H768 L864 352 V416 H352 L160 336 Z M432 416 H592 V640 H432 Z M288 640 H736 V768 H288 Z"/>
</svg>
