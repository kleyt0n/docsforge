[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docsforge"
# Read from `__version__` in src/docsforge/__init__.py by [tool.hatch.version]
# below — one place to bump, and `docsforge.__version__` can never disagree
# with the version on PyPI.
dynamic = ["version"]
description = "A short, punchy description of docsforge — what it does and for whom."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Docsforge contributors" }]
keywords = ["documentation", "template", "mkdocs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Runtime dependencies use lower bounds only: no speculative upper caps, so the
# package composes cleanly in larger environments. Add a narrow upper bound only
# when a specific newer major is known to break you, with the reason inline.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "mypy>=1.11",
    "pre-commit>=3.7",
]
# Everything the documentation site needs. `uv sync --extra docs` is enough to
# run `mkdocs serve` — this is what the docs CI job installs.
docs = [
    # Deliberate upper bound: MkDocs 2.0 removes the plugin system and the
    # theming layer this setup is built on, with no migration path. Lift the
    # cap only once Material for MkDocs supports it.
    "mkdocs>=1.6,<2",
    # `[imaging]` pulls in Pillow and CairoSVG for the social-cards plugin. The
    # plugin only generates cards when CI=true (see mkdocs.yml), but the Python
    # packages install everywhere, so the CI build needs no special extra.
    "mkdocs-material[imaging]>=9.7.7",
    "mkdocstrings[python]>=0.25",
    "pymdown-extensions>=10.0",
]

[project.urls]
Homepage = "https://github.com/kleyt0n/docsforge"
Documentation = "https://kleyt0n.github.io/docsforge/"
Repository = "https://github.com/kleyt0n/docsforge"
Issues = "https://github.com/kleyt0n/docsforge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/docsforge"]

[tool.hatch.version]
path = "src/docsforge/__init__.py"

[tool.pytest.ini_options]
# Doctests in `src/` run as part of the suite, so every example in the API
# reference is verified on each commit.
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.coverage.report]
# Ratchet upward over time; never lower it to make a pull request pass.
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.11"
# Tests and examples are checked too, not just `src`. They are the code most
# likely to drift from the API, and a `-> None` on a test costs nothing.
files = ["src", "tests", "examples", "conftest.py"]
# Strict from the first commit. Turning strictness on later means retrofitting
# annotations onto code written without them, which nobody ever gets around to.
strict = true
pretty = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Ruff formats Python inside Markdown fences. That is usually welcome, but it
# rewrites the docs-only syntax this template relies on — `--8<--` includes
# become `--8 < --`, and `# (1)!` annotation markers get re-spaced. Docs are
# reviewed as prose; leave them alone.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]        # docstrings not required in tests
"examples/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
